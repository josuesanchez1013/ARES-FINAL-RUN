[pytest]
# Scope collection to the tests/ directory so ad-hoc/root scripts are never
# imported during discovery (this is what caused bare `pytest` to hang).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registered markers (avoids PytestUnknownMarkWarning and enables opt-in suites).
# `live` and `integration` tests hit real systems/LLM/SSH and are DESELECTED by
# default; run them explicitly, e.g.:  pytest -m live   /   pytest -m integration
markers =
    live: tests that require a real LLM provider and/or real target (SSH/VM). Opt-in.
    integration: tests that exercise multiple components or external services. Opt-in.

# Default run is fast + offline: skip live and integration unless explicitly selected.
addopts = -m "not live and not integration"
